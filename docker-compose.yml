version: '3.8'

services:
  # PostgreSQL with PGVector extension for storing embeddings
  pgvector:
    image: ankane/pgvector:latest
    container_name: pgvector_db
    environment:
      POSTGRES_USER: sagar
      POSTGRES_PASSWORD: narisetti
      POSTGRES_DB: rag_database
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sagar -d rag_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Streamlit application container
  streamlit_app:
    build: .
      # context: .
      # dockerfile: Dockerfile
    container_name: streamlit_app
    env_file:
      - .env
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app # Mount application code
    depends_on: # Ensure Streamlit starts after PostgreSQL is healthy
      pgvector: # Wait for pgvector to be healthy before starting Streamlit
        condition: service_healthy # Ensure Streamlit starts only after PostgreSQL is ready
    environment:
      - DATABASE_URL=postgresql://sagar:narisetti@pgvector:5432/rag_database
      - HF_HOME=/model # HuggingFace home directory
      - TRANSFORMERS_CACHE=/model  # HuggingFace cache location
      - HF_HUB_OFFLINE=1 # Force HuggingFace to use local files only
      - PYTHONUNBUFFERED=1 # Ensures real-time logging
    networks:
      - rag_network

volumes:
  pgvector_data: # Persistent storage for PostgreSQL data
  huggingface_cache: # Persistent storage for HuggingFace models and embeddings

networks:
  rag_network: # Custom network for our services
    driver: bridge # Isolated network for better performance and security