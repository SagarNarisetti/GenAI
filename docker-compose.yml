version: '3.8'

services:
  # PostgreSQL with PGVector extension for storing embeddings
  pgvector:
    image: ankane/pgvector:latest
    container_name: pgvector_db
    environment:
      POSTGRES_USER: sagar
      POSTGRES_PASSWORD: narisetti
      POSTGRES_DB: rag_database
    ports:
      - "5432:5432"
    volumes:
      - pgvector_data:/var/lib/postgresql/data
    networks:
      - rag_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_database"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Streamlit application container
  streamlit_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: streamlit_app
    ports:
      - "8501:8501"
    volumes:
      - ./app:/app                              # Mount application code
      - ./models:/app/models                    # Mount local models directory
      - huggingface_cache:/root/.cache/huggingface  # Cache for HuggingFace models
    depends_on:
      pgvector:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://sagar:narisetti@pgvector:5432/rag_database
      - TRANSFORMERS_CACHE=/app/models         # HuggingFace cache location
      - HF_HOME=/app/models                    # HuggingFace home directory
      - CUDA_VISIBLE_DEVICES=0                 # Use GPU 0 (remove if CPU only)
    networks:
      - rag_network
    # Uncomment if using GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

volumes:
  pgvector_data:
  huggingface_cache:

networks:
  rag_network:
    driver: bridge