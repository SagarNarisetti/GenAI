apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rag-app-ingress
  namespace: rag-app
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: rag-app-local.com  # domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: rag-app-service
                port:
                  number: 8501