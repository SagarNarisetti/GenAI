# -- Database service ----
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
  namespace: rag-app
spec:
  selector:
    app: postgres
  ports:
    - protocol: TCP
      port: 5432
      targetPort: 5432
---
# ---- RAG App (Streamlit + LLM) Service ----
apiVersion: v1
kind: Service
metadata:
  name: rag-app-service
  namespace: rag-app
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: "instance"
    service.beta.kubernetes.io/aws-load-balancer-schema: "internet-facing"
spec:
  selector:
    app: rag-app
  ports:
    - protocol: TCP
      port: 8501
      targetPort: 8501
  type: LoadBalancer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bedrock-sa
  namespace: rag-app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::${AWS_ACCOUNT_ID}:role/mleng-bedrock-pod-role
---