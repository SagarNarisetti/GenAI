### CI/CD workflow for the project. This workflow will run on every push to the main branch and on pull requests targeting the main branch.
name: GenAI APP Infrastructure CI/CD

# Trigger the workflow on pushes or pull requests to the 'main' branch
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # CI Job: Build and Test
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Check out the code from the repository

      - name: Set up Python 3.10 # Use the setup-python action to set up Python 3.10 for the workflow
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # CD Job: Deploy (runs only if CI job succeeds)
  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Deploying to Production
        run: echo "Executing deployment scripts..."
        # Replace this with specific deployment actions (e.g., to AWS, Azure, or SSH)


env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
